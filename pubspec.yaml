name: elcontrasteapp
description: "Proyecto Beta de la aplicación de El Contraste"
publish_to: 'none'
version: 3.1.0+31

environment:
  sdk: ^3.9.0

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_html: ^3.0.0
  flutter_local_notifications: ^21.0.0
  font_awesome_flutter: ^10.12.0
  http: ^1.5.0
  just_audio: ^0.10.5
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/icon/c_blanca.png
